name: Flutter Drive (integration)

# example 的集成测试（flutter drive）。
# 说明：
#   - example/test_driver 依赖 flutter_driver + test（已在 example dev_dependencies 声明）
#   - 已移除过时的 `architecture: x64`（现代 macOS runner 为 arm64）
#   - 仅在 example 或 kit 源码变更时运行，避免文档改动也跑重型模拟器
on:
  push:
    branches: [master]
    paths:
      - "example/**"
      - "lib/**"
      - "pkgs/**"
  pull_request:
    branches: [master]
    paths:
      - "example/**"
      - "lib/**"
      - "pkgs/**"
  workflow_dispatch:

concurrency:
  group: drive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drive_android:
    name: Drive (android, api ${{ matrix.api-level }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [31]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('example/android/**/*.gradle*', 'example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run Flutter Driver tests
        uses: reactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          working-directory: example
          script: flutter drive --target=test_driver/app.dart
